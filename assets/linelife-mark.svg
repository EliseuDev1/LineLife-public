    <circle cx="213" cy="95" r="13"/>
  </g>
  <path d="M128 49l48 18v45c0 38-22 61-48 75-26-14-48-37-48-75V67l48-18z" fill="url(#shield)" stroke="#d9fff6" stroke-width="5" filter="url(#shadow)"/>
  <path d="M103 115l17 18 34-37" fill="none" stroke="#082033" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128 68v17" stroke="#effffb" stroke-width="5" stroke-linecap="round" opacity=".8"/>
